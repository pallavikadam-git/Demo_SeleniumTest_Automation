##########################################
# ReportPortal connection configuration
##########################################

# ReportPortal server URL (without /api/v1 at the end)
rp.endpoint = https://demo.reportportal.io

# Your ReportPortal project name (format: <organization>_<project>)
# Example: "default_personal"
rp.project = default_personal

# Authentication token for the user
# Generate from ReportPortal UI (Profile ? API Access ? Copy token)
rp.uuid = kalyan_w5zs3-0nR0yVecmSqDi382JNko9QlvbUD0xtvYgmcuJ0uGFPQYcd3VR37WcVKQqs


##########################################
# Launch configuration
##########################################

# Launch name (appears in ReportPortal UI)
rp.launch = Full_Regression_Kalyan221

# Launch description
rp.description = This is report portal integration with Test Automation FrameWork for Regression Test Run Demo.

# Comma-separated list of tags for the launch
rp.tags = regression, nightly, java

# Mode of execution: DEFAULT (store results) | DEBUG (do not store results)
rp.mode = DEFAULT

# True ? disable sending test results to ReportPortal
rp.enable = true


##########################################
# Test item hierarchy
##########################################

# Default attributes for all test items
# Format: key:value,key2:value2
rp.attributes = env:qa,service:payments

# Whether skipped tests should be reported
rp.report.skipped = true


##########################################
# Logging configuration
##########################################

# Maximum log batch size before sending (default: 20)
rp.batch.size.logs = 20

# Maximum log message length (characters)
rp.log.message.length.limit = 1000

# Max size (bytes) for file attachments in logs (default: 5 MB)
rp.max.attach.size = 5242880


##########################################
# Advanced settings (optional)
##########################################

# Enable async reporting (recommended for faster execution)
rp.reporting.async = true

# Retry count for failed requests to RP
rp.http.retries = 3

# Connection timeout (milliseconds)
rp.http.connectionTimeout = 20000

# Read timeout (milliseconds)
rp.http.readTimeout = 60000